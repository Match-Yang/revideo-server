[package]
name = "revideo-app"
version = "0.1.0"
edition = "2021"
description = "Revideo — Video Rendering & Translation Desktop App"
default-run = "revideo-app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json"] }

# Internal crates
revideo-core = { path = "../crates/revideo-core" }
revideo-translate = { path = "../crates/revideo-translate" }
revideo-render = { path = "../crates/revideo-render" }
revideo-platforms = { path = "../crates/revideo-platforms" }
revideo-sidecar = { path = "../crates/revideo-sidecar" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
