<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频渲染</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 480px;
      background: #1a1a1a;
      border-radius: 12px;
      padding: 32px;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 24px;
      color: #fff;
    }
    label {
      display: block;
      font-size: 14px;
      color: #999;
      margin-bottom: 8px;
    }
    select {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
      appearance: none;
    }
    select:focus { border-color: #666; }
    .info {
      margin-top: 8px;
      font-size: 13px;
      color: #777;
    }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #4a9eff;
      color: #fff;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) { background: #3a8eef; }
    button:disabled { background: #333; color: #666; cursor: not-allowed; }
    .status {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .status.rendering { display: block; background: #1a2a1a; color: #6f6; }
    .status.success { display: block; background: #1a2a1a; color: #6f6; }
    .status.error { display: block; background: #2a1a1a; color: #f66; }
    .empty { text-align: center; color: #666; padding: 40px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>视频渲染</h1>
    <div id="loading" class="empty">加载中...</div>
    <div id="main" style="display:none">
      <label>选择视频文件夹</label>
      <select id="dirSelect"></select>
      <div id="dirInfo" class="info"></div>
      <button id="renderBtn" disabled>开始渲染</button>
      <div id="status" class="status"></div>
    </div>
    <div id="noDirs" class="empty" style="display:none">
      ~/Movies 下没有找到包含视频的文件夹
    </div>
  </div>

  <script src="client.js"></script>
</body>
</html>
