name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: true

env:
  NODE_VERSION: "22"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            ext: tar.gz
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            ext: tar.gz
          - os: macos-latest
            platform: darwin-arm64
            ext: tar.gz
          - os: windows-latest
            platform: win-x64
            ext: zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build server
        run: npm run build

      - name: Build dashboard
        run: |
          npm run dashboard:install
          npm run dashboard:build

      - name: Determine version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release package
        shell: bash
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          # Remove files not needed in production
          rm -rf src/
          rm -rf .github/
          rm -rf .claude/
          rm -rf .agents/
          rm -rf dashboard/src/
          rm -rf dashboard/node_modules/
          rm -f dashboard/package.json dashboard/tsconfig.json dashboard/next.config.ts
          rm -rf node_modules/.cache
          rm -f tsconfig.json eslint.config.mjs .prettierrc .prettierignore
          rm -f .env .env.local
          rm -f .DS_Store Thumbs.db

          # Remove puppeteer's bundled Chrome (~200MB)
          rm -rf node_modules/puppeteer/.local-chromium/
          find node_modules -type d -name "chrome-*" -path "*/puppeteer/*" -exec rm -rf {} + 2>/dev/null || true

          # Ensure data directory exists
          mkdir -p data/browser/profile

      - name: Create tar.gz archive (Unix)
        if: matrix.ext == 'tar.gz'
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          cd ..
          mv revideo-server "revideo-${VERSION_TAG}-${PLATFORM}"
          tar -czf "revideo-${VERSION_TAG}-${PLATFORM}.tar.gz" "revideo-${VERSION_TAG}-${PLATFORM}"
          mv "revideo-${VERSION_TAG}-${PLATFORM}" revideo-server
          mv "revideo-${VERSION_TAG}-${PLATFORM}.tar.gz" revideo-server/

      - name: Create zip archive (Windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          Compress-Archive -Path * -DestinationPath "revideo-${env:VERSION_TAG}-${env:PLATFORM}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: revideo-${{ matrix.platform }}
          path: |
            revideo-*.tar.gz
            revideo-*.zip
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: false

      - name: Collect archives and determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p release-assets
          find artifacts/ -name "revideo-*.tar.gz" -exec cp {} release-assets/ \;
          find artifacts/ -name "revideo-*.zip" -exec cp {} release-assets/ \;
          ls -lh release-assets/

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Revideo Server ${{ steps.version.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true

      - name: Upload to Gitee Releases
        if: vars.GITEE_REPO != ''
        shell: bash
        env:
          GITEE_REPO: ${{ vars.GITEE_REPO }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: |
          for file in release-assets/*; do
            echo "Uploading $(basename "$file") to Gitee..."
            curl -s -X POST \
              "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases" \
              -H "Authorization: token ${GITEE_TOKEN}" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "tag_name=${VERSION_TAG}" \
              -F "name=Revideo Server ${VERSION_TAG}" \
              -F "file=@${file}" || echo "Warning: Gitee upload failed for $(basename "$file")"
          done
